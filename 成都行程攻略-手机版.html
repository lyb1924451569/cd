<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="成都行程">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#B3341F">
<title>成都美食之旅 · 10/2—10/6</title>
<style>
/* SECTION: reset-and-tokens */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#B3341F; --brand-soft:#F7E7E2; --brand-deep:#8C2416;
  --ink:#1F1A17; --ink-2:#5C524C; --ink-3:#8C817A;
  --bg:#FAF7F3; --card:#FFFFFF; --line:#ECE5DE;
  --warn-bg:#FFF6E5; --warn-line:#F0B429; --warn-ink:#7A5300;
  --danger-bg:#FDECEA; --danger-line:#D93025; --danger-ink:#8C1C13;
  --ok:#1E7A46; --ok-bg:#E8F5EC;
  --eat:#C8641E; --sight:#1F6F8B; --transit:#5B4B8A;
  --r:14px; --r-sm:10px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  font-size:15px; line-height:1.65; letter-spacing:.1px;
  padding-top:calc(var(--safe-t) + 0px);
}
@media (min-width:760px){ body{display:flex;justify-content:center;background:#EDE7E0} }
#app{width:100%;max-width:560px;background:var(--bg);min-height:100vh;position:relative}
@media (min-width:760px){ #app{box-shadow:0 0 40px rgba(0,0,0,.12)} }

/* SECTION: sticky-header */
.topbar{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(160deg,var(--brand) 0%,var(--brand-deep) 100%);
  color:#fff; padding:calc(var(--safe-t) + 12px) 16px 0;
  box-shadow:0 2px 12px rgba(140,36,22,.25);
}
.topbar h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.5px}
.topbar .sub{margin:3px 0 10px;font-size:12.5px;opacity:.88;display:flex;flex-wrap:wrap;gap:4px 10px}
.topbar .sub b{font-weight:600;opacity:1}

/* SECTION: tabs */
.tabs{
  display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; padding:0 0 0; margin:0 -16px; padding-left:16px; padding-right:16px;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; min-width:62px; min-height:44px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; padding:6px 12px; margin-bottom:8px;
  border-radius:11px 11px 0 0; border:0; cursor:pointer;
  background:rgba(255,255,255,.16); color:rgba(255,255,255,.82);
  font-family:inherit; font-size:14px; font-weight:600;
  transition:background .18s,color .18s;
}
.tab span{font-size:10.5px;font-weight:400;opacity:.85}
.tab[aria-selected="true"]{background:var(--bg);color:var(--brand)}
.tab[aria-selected="true"] span{opacity:.7}
.tab:active{transform:scale(.97)}

/* SECTION: layout */
main{padding:14px 14px calc(var(--safe-b) + 88px)}
.panel{display:none;animation:fade .22s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h2.sec{font-size:16px;margin:20px 2px 10px;display:flex;align-items:center;gap:7px;color:var(--ink)}
h2.sec:first-child{margin-top:4px}
h2.sec::before{content:"";width:4px;height:16px;background:var(--brand);border-radius:2px}

.dayhead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.dayhead .dt{font-size:13px;color:var(--brand);font-weight:700;letter-spacing:.4px}
.dayhead h3{margin:2px 0 6px;font-size:18px}
.dayhead .hl{font-size:13.5px;color:var(--ink-2);background:var(--brand-soft);border-radius:var(--r-sm);padding:8px 10px;line-height:1.55}

/* SECTION: timeline */
.tl{position:relative;padding-left:6px}
.tl::before{content:"";position:absolute;left:52px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;display:flex;gap:12px;padding:0 0 10px}
.ev .tm{
  flex:0 0 46px; text-align:right; padding-top:11px;
  font-size:12.5px; font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums;
}
.ev .dot{position:absolute;left:46px;top:16px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--brand);z-index:2;margin-left:-5px}
.ev .body{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-left:8px}
.ev.key .dot{border-color:var(--brand);background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.ev.key .body{border-color:#E4C4BC;background:linear-gradient(180deg,#FFFDFC,#FDF5F2)}
.ev.key .tm{color:var(--brand);font-size:14px}
.ev .tt{font-size:15px;font-weight:650;margin:0 0 4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ev .dt2{font-size:13.5px;color:var(--ink-2);margin:0;white-space:pre-line}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;line-height:1.5;vertical-align:1px}
.p-eat{background:#FDEEE0;color:var(--eat)} .p-sight{background:#E4F0F4;color:var(--sight)}
.p-transit{background:#EDE9F6;color:var(--transit)} .p-todo{background:#E9F2EC;color:var(--ok)}
.p-avoid{background:#F0EDEB;color:var(--ink-3)} .p-decision{background:#FFF1E6;color:#B4531A}
.p-friend{background:var(--brand);color:#fff}
.sub{margin-top:8px;border-radius:var(--r-sm);padding:8px 10px;font-size:13px;line-height:1.6}
.sub.warn{background:var(--warn-bg);border-left:3px solid var(--warn-line);color:var(--warn-ink)}
.sub.danger{background:var(--danger-bg);border-left:3px solid var(--danger-line);color:var(--danger-ink)}
.sub.note{background:#F6F3EF;color:var(--ink-2)}
.sub.transit{background:#F1F6F8;color:#33606F}
.sub b{font-weight:700}

/* SECTION: alerts */
.alertwrap{padding:14px 14px 0}
.alert-toggle{
  width:100%; min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:11px 13px; margin-bottom:10px; border:1px solid #F0D6D1; border-radius:var(--r);
  background:linear-gradient(135deg,#FDECEA,#FFF6E5); color:var(--danger-ink);
  font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
}
.alert-toggle .chev{font-size:13px;color:var(--ink-3)}
.alert-toggle:active{transform:scale(.99)}
.alert{border-radius:var(--r);padding:12px 13px;margin-bottom:10px;border:1px solid}
.alert.danger{background:var(--danger-bg);border-color:#F2C4BF}
.alert.warn{background:var(--warn-bg);border-color:#F3DCAC}
.alert h4{margin:0 0 5px;font-size:14.5px;display:flex;gap:6px;align-items:center}
.alert.danger h4{color:var(--danger-ink)} .alert.warn h4{color:var(--warn-ink)}
.alert p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.6}
.alert .act{margin-top:7px;font-size:13px;font-weight:650;color:var(--ink);background:rgba(255,255,255,.72);border-radius:8px;padding:6px 9px}

/* SECTION: cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}
.card h4{margin:0 0 7px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card .row{font-size:13.5px;color:var(--ink-2);margin:5px 0;line-height:1.6}
.card .row b{color:var(--ink);font-weight:650}
.card .tag{font-size:11px;font-weight:700;color:#fff;background:var(--brand);border-radius:20px;padding:2px 9px}
.card .tag.asg{background:var(--ok)}
.kv{display:grid;grid-template-columns:64px 1fr;gap:3px 9px;font-size:13px;margin-top:7px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;color:var(--ink-2)}

/* SECTION: todo */
.todo{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;cursor:pointer;min-height:44px}
.todo.done{background:#F4F8F5;border-color:#CFE3D5}
.todo.done .tt2{text-decoration:line-through;color:var(--ink-3)}
.cbx{flex:0 0 24px;height:24px;margin-top:1px;border-radius:7px;border:2px solid #CFC5BC;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:.15s}
.todo.done .cbx{background:var(--ok);border-color:var(--ok)}
.todo .tt2{font-size:15px;font-weight:650;margin:0 0 3px}
.todo .dl{font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:2px 7px;display:inline-block;margin-bottom:6px}

/* SECTION: tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.tbl th{background:#F4EFE9;text-align:left;padding:8px 9px;font-weight:650;color:var(--ink-2);font-size:12.5px}
.tbl td{padding:8px 9px;border-top:1px solid var(--line);color:var(--ink-2);vertical-align:top}
.tbl tr.best td{background:#F0F8F2;color:var(--ink)}
.tbl .amt{font-weight:700;color:var(--brand);white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:10px;border-radius:var(--r)}

/* SECTION: food-cat */
.cat-h{font-size:15px;font-weight:700;margin:16px 2px 8px;color:var(--brand);display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.cat-h small{font-size:12px;font-weight:400;color:var(--ink-3)}
.dish{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;margin-bottom:8px}
.dish .n{font-size:14.5px;font-weight:650;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dish .a{font-size:12px;color:var(--ink-3);margin-top:2px}
.dish .d{font-size:13px;color:var(--ink-2);margin-top:5px;line-height:1.6}
.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--brand);color:#fff}
.badge.near{background:#E4F0F4;color:var(--sight)}
.badge.fr{background:var(--ok)}

/* SECTION: fab */
.fab{
  position:fixed; right:calc(50% - 280px + 14px); bottom:calc(var(--safe-b) + 16px);
  z-index:50; min-height:44px; padding:11px 17px; border:0; border-radius:24px;
  background:var(--brand); color:#fff; font-family:inherit; font-size:14px; font-weight:650;
  box-shadow:0 4px 16px rgba(140,36,22,.34); cursor:pointer; display:flex; align-items:center; gap:6px;
}
@media (max-width:759px){ .fab{right:14px} }
.fab:active{transform:scale(.96)}
.foot{text-align:center;font-size:11.5px;color:var(--ink-3);padding:18px 10px 6px;line-height:1.7}
</style>
</head>

        { time: "8:00", title: "城际列车 犀浦 → 离堆公园站", type: "transit", detail: "约23分钟，单程10元。出站打车约10分钟到「秦堰楼6号门」。", note: "门票：成人80元，已预约「上午 08:00—10:00」时段。旺季检票 08:00—18:00，17:30 停止检票；日场票最晚须 20:00 前出园。" },
        { time: "8:30", title: "都江堰景区 · 推荐路线", type: "sight", detail: "秦堰楼6号门 → 二王庙 → 安澜索桥 → 鱼嘴 → 飞沙堰 → 宝瓶口 → 离堆公园正门出。全程下坡、不走回头路，约 2~2.5 小时。", highlight: true, note: "想爬坡就从南门进；从6号门进会错过部分非核心景点，但省力省时间。可选：玉垒阁电梯40元单独购票，可俯瞰全景。", warn: "⚠️ 雨天注意：石板路 + 台阶遇雨极滑，务必穿防滑鞋；安澜索桥在雨中晃动明显，恐高者慎行。" },
        { time: "11:30", title: "午餐 · 川江渔府（总店）", type: "eat", friend: true, detail: "都江堰市翔和路127号。创于2002的都江堰20+年本地老字号，非遗底料。招牌：非遗红锅鱼火锅、现杀花鲢/黄辣丁、美蛙、手工豆花、豆浆馍馍、甜皮鸭。人均 60~67。", transit: "从离堆公园正门/南桥步行约12分钟（800米~1公里），或打车3分钟/起步价。", note: "营业 10:30—22:30，正好接上你游完景区的时间。窗边位可赏南桥夜景；口碑「不宰客、家庭聚餐首选」。⚠️ 你朋友给的地址是「翔和路与观凤路交叉口东北方向29米」，实际门牌为翔和路127号，导航搜店名即可。" },
        { time: "13:30", title: "下午三选一", type: "decision", detail: "A. 直接回成都【推荐】：约13:30 启程，15:00 前回到酒店，休息后从容吃收官大餐。\nB. 加游青城山前山：犀浦 → 青城山站高铁约28分钟；10月开放 8:30—17:00（16:30停止售票），成人票80。凑齐「拜水都江堰、问道青城山」。\nC. 留到晚上看「都江·夜堰」：沉浸式夜游，成人票80元需单独购票，20:00 后开始。", note: "我的建议是 A：守住「美食优先」，不暴走，而且今晚是你的自由夜，回成都才有得玩。", warn: "B 需爬山2~3小时，雨天湿滑，会大幅压缩晚餐时间。C 不建议：结束较晚，回成都近1.5小时，而明天 15:30 的航班要求 12:15 出发。" },
        { time: "18:30", title: "晚餐 · 收官大餐", type: "eat", detail: "这一顿值得认真挑，和前几天不重样：① **拈一筷子（九眼桥店）**——宜宾江湖菜，干煸牛肉丝、荔枝烧花甲，适合3~4人，**离酒店最近可步行**；② 陶得砂锅（蜀汉路店，青豆肥肠、蒜蓉虾仁、土豆煨牛肉、鲫鱼水饺）；③ 饕林餐厅（春熙路店，非遗活渡鱼、特色回锅肉）；④ 或者再吃一顿火锅，把 10/3 没轮到的那家（蜀九香/电台巷/皇城老妈）补上。", highlight: true, note: "成都本地人的常规操作就是连着几天吃火锅不腻。" },
        { time: "21:00", title: "安顺廊桥 + 合江亭夜景（10/2没看成的那次）", type: "sight", detail: "锦江两岸灯光，从酒店步行即达。这是成都最有辨识度的城市景观，**今晚是全程最后一个自由夜，专程来看最合适**。", note: "河岸蓝色灯带（「蓝眼泪」）约 23:00 关灯，21:00—22:30 是最佳时段。" },
        { time: "21:30", title: "夜宵（可选）· 草屋烧烤", type: "eat", friend: true, detail: "锦江区晨辉东路2号附151号（同片区另标注为「晨辉北路3号5栋1楼附7-8号·琉璃场店」）。成都连锁烧烤，10年老店。招牌：烤猪蹄、掌中宝、大排骨、鸡皮、小香肠、五花肉、烤茄子。人均 46~68，营业约 17:00—次日01:00。", transit: "6号线顺江路 → 琉璃场站（3站直达），步行约600~800米。或打车约15分钟/20元。", warn: "⚠️ 如果晚餐已经吃了火锅或大餐，这顿就别硬塞了——叶凤烧烤昨晚已经吃过烧烤。想轻松点就只去安顺廊桥散步，或到九眼桥/兰桂坊喝一杯收尾。明天 12:15 必须上车。" },
        { time: "23:00", title: "睡前 · 最后一晚准备", type: "todo", detail: "① 收拾行李，把伴手礼位置留好；② 再次跟前台确认明天延迟退房至 12:00 或行李寄存；③ 在网约车 App 里预约明天 08:50 去幺怪面的车；④ 查一下明天的天气。", highlight: true }
      ]
    },

        { time: "09:00", title: "早餐 · 幺怪面", type: "eat", friend: true, detail: "米其林必比登连续三年上榜、成都面馆50强。招牌：八宝海味面（招牌）、素椒杂酱面、火爆双脆面、笋子烧肉面，煎蛋必加。人均 19~25。", highlight: true, note: "⚠️ 营业约 09:00—16:00，仅午市，**周六休息** —— 所以原计划 10/3（周六）本来就去不了；今天周二正常营业，9:00 开门即到，赶在你 12:15 上车前绰绰有余。夫妻店仅一口锅，等面 20~30 分钟很常见；店面极小只能拼桌或坐路边。预计 9:45 前吃完。", transit: "备选走法：6号线到东光站换乘8号线1站到净居寺站，步行约600米。但返程日赶时间，建议直接打车。" },
        { time: "10:00", title: "买伴手礼 · 春熙路 / 太古里", type: "todo", detail: "火锅底料、郫县豆瓣、张飞牛肉、蜀绣、竹叶青茶。超市和特产店都有。", transit: "2号线2站直达春熙路，最省事。更省事的选择：双流机场 T2 候机区也有特产店，价格略高，可以留到最后买。" },

        { time: "12:15", title: "上车出发（硬性底线）", type: "transit", detail: "九眼桥 → 双流机场 T2，打车正常约30~40分钟，国庆返程日预留 60~75 分钟。九眼桥比春熙路离机场更近，这是你住这儿的一个实际好处。", highlight: true, warn: "⚠️ 这是全程最后一个不可妥协的时间点。地铁方案（牛王庙→春熙路换3号线→太平园换10号线→双流机场2航站楼站，约50~60分钟、6元）需要三次换乘 + 拎行李，返程日不推荐。" },

        { time: "备选", title: "如果不想跑幺怪面", type: "decision", detail: "想给旅行一个「成都式」收尾 → 人民公园鹤鸣茶社再喝一次盖碗茶（2号线直达，约20分钟）。想清静收尾或雨大 → 成都博物馆（免费预约，室内；周一闭馆但法定节假日除外，10/6 正常开放）。还没去过景点 → 武侯祠·锦里（打车约25分钟）。三选一，别叠加。" }

  overview: [

<script>
/* SECTION: app-script */
(function(){
  "use strict";
  var D = window.TRIP_DATA;
  var tabsEl = document.getElementById("tabs");
  var mainEl = document.getElementById("main");
  var fabEl = document.getElementById("fab");
  var footEl = document.getElementById("foot");

  /* SECTION: storage — 勾选状态存当前浏览器本地 */
  var LS_KEY = "cd-trip-todos-v1";
  var LS_ALERT = "cd-trip-alerts-v1";
  function loadState(){
    try{ var raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : {}; }
    catch(e){ return {}; }
  }
  function saveState(s){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){}
  }
  var doneMap = loadState();

  /* SECTION: escape */
  function esc(s){
    if(s === null || s === undefined) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  /* SECTION: inline-bold — 把 **粗体** 与 ⚠️ 标记转成安全标签 */
  function rich(s){
    if(!s) return "";
    var out = esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    return out.replace(/\n/g, "<br>");
  }

  /* SECTION: type-labels */
  var TYPE_LABEL = { eat:"吃", sight:"逛", transit:"行", todo:"办", avoid:"避", decision:"选" };
  var TYPE_CLASS = { eat:"p-eat", sight:"p-sight", transit:"p-transit", todo:"p-todo", avoid:"p-avoid", decision:"p-decision" };

  /* SECTION: tab-model */
  var TABS = [];
  D.days.forEach(function(d){ TABS.push({ id:d.id, label:d.tab, sub:d.weekday }); });
  TABS.push({ id:"p-ticket", label:"抢票", sub:"待办" });
  TABS.push({ id:"p-food",   label:"美食", sub:"清单" });
  TABS.push({ id:"p-info",   label:"实用", sub:"交通天气" });
  TABS.push({ id:"p-over",   label:"速记", sub:"总览" });

  /* SECTION: default-tab — 出行期间自动定位到当天 */
  function defaultTab(){
    var now = new Date();
    var key = now.getFullYear() + "-" + (now.getMonth()+1) + "-" + now.getDate();
    var map = { "2026-10-2":"d1002","2026-10-3":"d1003","2026-10-4":"d1004","2026-10-5":"d1005","2026-10-6":"d1006" };
    if(map[key]) return map[key];
    var tripStart = new Date(2026,9,2);
    if(now < tripStart) return "p-ticket";   /* 出行前：先看抢票 */
    return "p-over";
  }

  /* SECTION: render-alerts — 常驻警示，渲染到 #alerts，所有 tab 下均可见 */
  function alertStack(){
    var h = '<div class="alertwrap" id="alertwrap">';
    h += '<button class="alert-toggle" id="alertToggle" type="button" aria-expanded="true">'
      +  '<span>⚠️ 全程必读提醒（' + D.alerts.length + '）</span><span class="chev" id="alertChev">▾</span></button>';
    h += '<div id="alertBody">';
    D.alerts.forEach(function(a){
      h += '<div class="alert ' + a.level + '">';
      h += '<h4>' + (a.level === "danger" ? "🚨 " : "⚠️ ") + esc(a.title) + '</h4>';
      h += '<p>' + rich(a.body) + '</p>';
      if(a.action) h += '<div class="act">→ ' + rich(a.action) + '</div>';
      h += '</div>';
    });
    h += '</div></div>';
    return h;
  }

  /* SECTION: render-day */
  function dayPanel(d){
    var h = '<div class="dayhead">';
    h += '<div class="dt">' + esc(d.tab) + ' ' + esc(d.weekday) + '</div>';
    h += '<h3>' + esc(d.title) + '</h3>';
    if(d.headline) h += '<div class="hl">' + rich(d.headline) + '</div>';
    h += '</div>';
    h += '<div class="tl">';
    d.items.forEach(function(it){
      var cls = "ev" + (it.highlight ? " key" : "");
      h += '<div class="' + cls + '">';
      h += '<div class="tm">' + esc(it.time) + '</div>';
      h += '<div class="dot"></div>';
      h += '<div class="body">';
      h += '<div class="tt">' + esc(it.title)
        +  '<span class="pill ' + (TYPE_CLASS[it.type] || "p-todo") + '">' + (TYPE_LABEL[it.type] || "") + '</span>'
        +  (it.friend ? '<span class="pill p-friend">朋友推荐</span>' : '')
        +  '</div>';
      if(it.detail) h += '<p class="dt2">' + rich(it.detail) + '</p>';
      if(it.transit) h += '<div class="sub transit">🚇 ' + rich(it.transit) + '</div>';
      if(it.note)    h += '<div class="sub note">💡 ' + rich(it.note) + '</div>';
      if(it.warn)    h += '<div class="sub warn">⚠️ ' + rich(it.warn) + '</div>';
      h += '</div></div>';
    });
    h += '</div>';
    return h;
  }

  /* SECTION: render-ticket */
  function ticketPanel(){
    var done = D.todos.filter(function(t){ return doneMap[t.id]; }).length;
    var h = '<div class="dayhead"><div class="dt">抢票与待办</div><h3>三个景点全部线上实名预约</h3>'
      + '<div class="hl">已完成 ' + done + ' / ' + D.todos.length + ' 项 · 勾选状态保存在本机浏览器，下次打开仍在</div></div>';
    h += '<div id="todoList">';
    D.todos.forEach(function(t){
      var isDone = !!doneMap[t.id];
      h += '<div class="todo' + (isDone ? " done" : "") + '" data-todo="' + esc(t.id) + '" role="checkbox" aria-checked="' + (isDone?"true":"false") + '" tabindex="0">';
      h += '<div class="cbx">' + (isDone ? "✓" : "") + '</div>';
      h += '<div style="flex:1;min-width:0">';
      h += '<div class="tt2">' + esc(t.priority) + ' ' + esc(t.title) + '</div>';
      h += '<div class="dl">⏰ ' + esc(t.deadline) + '</div>';
      if(t.detail)  h += '<div class="row">' + rich(t.detail) + '</div>';
      if(t.price)   h += '<div class="row"><b>价格：</b>' + esc(t.price) + '</div>';
      if(t.hours)   h += '<div class="row"><b>开放：</b>' + esc(t.hours) + '</div>';
      if(t.channel) h += '<div class="sub note">🎫 ' + rich(t.channel) + '</div>';
      h += '</div></div>';
    });
    h += '</div>';
    h += '<div class="card"><h4>统一注意事项</h4>'
      + '<div class="row">1. 三个景点全部线上实名预约、刷<b>身份证原件</b>入园，现场均不设售票窗口，白跑一趟概率极高。</div>'
      + '<div class="row">2. 三星堆<b>未授权任何第三方售票</b>，只认官方公众号、小程序、官网 sxd.cn。</div>'
      + '<div class="row">3. 熊猫基地明确<b>不支持二维码入园</b>。</div>'
      + '<div class="row">4. 都江堰门票当日单次有效，未使用须在游览截止前退订。</div></div>';
    return h;
  }

  /* SECTION: render-food */
  function foodPanel(){
    var h = '<div class="dayhead"><div class="dt">美食清单</div><h3>朋友推荐 6 家 + 本地分类清单</h3>'
      + '<div class="hl">' + rich(D.friendPicks.intro) + '</div></div>';
    h += '<h2 class="sec">朋友推荐（已排进对应餐位）</h2>';
    D.friendPicks.list.forEach(function(r){
      h += '<div class="card">';
      h += '<h4>' + esc(r.name) + '<span class="tag asg">' + esc(r.assigned) + '</span><span class="tag">' + esc(r.cat) + '</span></h4>';
      h += '<dl class="kv">';
      h += '<dt>地址</dt><dd>' + esc(r.addr) + '</dd>';
      h += '<dt>招牌</dt><dd>' + esc(r.dishes) + '</dd>';
      h += '<dt>价格</dt><dd>' + esc(r.price) + '</dd>';
      h += '<dt>营业</dt><dd>' + esc(r.hours) + '</dd>';
      h += '<dt>怎么去</dt><dd>' + esc(r.transit) + '</dd>';
      h += '</dl>';
      if(r.addrNote) h += '<div class="sub warn">📍 ' + rich(r.addrNote) + '</div>';
      if(r.limit)    h += '<div class="sub danger">⛔ ' + rich(r.limit) + '</div>';
      if(r.note)     h += '<div class="sub note">💡 ' + rich(r.note) + '</div>';
      h += '</div>';
    });

    h += '<h2 class="sec">本地分类清单</h2>';
    D.foodList.forEach(function(c){
      h += '<div class="cat-h">' + esc(c.cat) + (c.tip ? '<small>' + esc(c.tip) + '</small>' : '') + '</div>';
      c.items.forEach(function(i){
        h += '<div class="dish"><div class="n">' + esc(i.name)
          + (i.near ? '<span class="badge near">离酒店近</span>' : '')
          + (i.friend ? '<span class="badge fr">朋友推荐</span>' : '') + '</div>';
        if(i.addr) h += '<div class="a">📍 ' + esc(i.addr) + '</div>';
        h += '<div class="d">' + esc(i.dish) + '</div></div>';
      });
    });
    return h;
  }

  /* SECTION: render-info */
  function infoPanel(){
    var h = '<h2 class="sec">交通速查（以酒店为起点）</h2>';
    h += '<div class="card" style="padding:0;overflow:hidden"><div class="scroll" style="margin:0;border-radius:0">'
      + '<table class="tbl" style="border:0;border-radius:0"><thead><tr><th>目的地</th><th>走法</th><th>耗时</th></tr></thead><tbody>';
    D.transit.forEach(function(t){
      h += '<tr><td><b>' + esc(t.to) + '</b>' + (t.note ? '<br><span style="font-size:12px;color:var(--ink-3)">' + esc(t.note) + '</span>' : '') + '</td>'
        +  '<td>' + esc(t.how) + '</td><td class="amt">' + esc(t.time) + '</td></tr>';
    });
    h += '</tbody></table></div></div>';

    h += '<div class="card"><h4>酒店位置</h4>'
      + '<div class="row"><b>' + esc(D.meta.hotel) + '</b></div>'
      + '<div class="row">' + esc(D.meta.hotelArea) + '</div>'
      + '<div class="row">最近地铁站：' + esc(D.meta.nearestMetro) + '</div>'
      + '<div class="sub note">💡 2号线往西直达犀浦（都江堰）、往东直达成都东客站（三星堆），两条远郊线路都不用换乘；6号线直达建设北路站（建设巷）和琉璃场站（叶凤/草屋烧烤）；夜宵步行可达九眼桥、兰桂坊。</div>'
      + '<div class="sub warn">⚠️ 入住时向前台确认最近地铁站和步行距离，或用地图App实测一次。本页时间估算按「到牛王庙站步行10分钟内」计。</div></div>';

    h += '<h2 class="sec">熊猫基地国庆交通专项</h2>';
    h += '<div class="card"><div class="row">' + rich(D.pandaTransit.intro) + '</div></div>';
    D.pandaTransit.options.forEach(function(o){
      h += '<div class="card"><h4>' + esc(o.name) + '<span class="tag">' + esc(o.tag) + '</span></h4>'
        + '<div class="row">' + esc(o.how) + '</div>'
        + '<div class="sub note">' + rich(o.verdict) + '</div></div>';
    });
    h += '<div class="card"><h4>园内动线与花花</h4>'
      + '<div class="row">' + rich(D.pandaTransit.route) + '</div>'
      + '<div class="sub note">🐼 ' + rich(D.pandaTransit.huahua) + '</div>'
      + '<div class="sub note">📅 ' + rich(D.pandaTransit.otherClose) + '</div>'
      + '<div class="sub transit">🌧 ' + rich(D.pandaTransit.rain) + '</div></div>';

    h += '<h2 class="sec">天气</h2>';
    h += '<div class="card"><div class="row">' + esc(D.weather.note) + '</div></div>';
    h += '<div class="scroll"><table class="tbl"><thead><tr><th>日期</th><th>墨迹 9/24</th><th>2345 9/23</th><th>综合</th></tr></thead><tbody>';
    D.weather.rows.forEach(function(r){
      h += '<tr' + (r.best ? ' class="best"' : '') + '><td><b>' + esc(r.date) + '</b></td><td>' + esc(r.moji) + '</td><td>' + esc(r.w2345) + '</td><td>' + esc(r.verdict) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="card"><h4>背景判断</h4><div class="row">' + rich(D.weather.background) + '</div></div>';
    h += '<div class="card"><h4>穿衣与装备</h4>';
    D.weather.packing.forEach(function(p){ h += '<div class="row">• ' + esc(p) + '</div>'; });
    h += '</div>';
    h += '<div class="card"><h4>天气对行程的影响</h4>';
    D.weather.impact.forEach(function(i){
      h += '<div class="row"><b>' + esc(i.spot) + '</b> ' + (i.ok ? '✅' : '⚠️') + ' ' + esc(i.note) + '</div>';
    });
    h += '</div>';

    h += '<h2 class="sec">雨天 / 暴雨备选</h2>';
    h += '<div class="card"><div class="row">' + esc(D.backup.intro) + '</div></div>';
    D.backup.items.forEach(function(b){
      h += '<div class="dish"><div class="n">' + esc(b.name) + '</div><div class="a">📍 ' + esc(b.addr) + '</div><div class="d">' + esc(b.note) + '</div></div>';
    });
    h += '<div class="alert danger"><h4>🚨 若 10/5 大雨</h4><p>' + rich(D.backup.djyRain) + '</p></div>';

    h += '<h2 class="sec">预算参考</h2>';
    h += '<div class="scroll"><table class="tbl"><thead><tr><th>项目</th><th>明细</th><th>金额</th></tr></thead><tbody>';
    D.budget.rows.forEach(function(b){
      h += '<tr><td><b>' + esc(b.item) + '</b></td><td>' + esc(b.detail) + '</td><td class="amt">' + esc(b.amount) + '</td></tr>';
    });
    h += '<tr class="best"><td><b>合计</b></td><td>' + esc(D.budget.note) + '</td><td class="amt">' + esc(D.budget.total) + '</td></tr>';
    h += '</tbody></table></div>';
    h += '<div class="card"><div class="row">' + esc(D.budget.extra) + '</div></div>';
    return h;
  }

  /* SECTION: render-overview */
  function overPanel(){
    var h = '<div class="dayhead"><div class="dt">一页速记</div><h3>' + esc(D.meta.title) + '</h3>'
      + '<div class="hl">' + esc(D.meta.subtitle) + ' · ' + esc(D.meta.stayNights) + '</div></div>';
    D.overview.forEach(function(o){
      h += '<div class="card"><h4>' + esc(o.date) + '</h4>'
        + '<div class="row"><b>主线：</b>' + esc(o.main) + '</div>'
        + '<div class="row"><b>吃饭：</b>' + esc(o.eat) + '</div>'
        + '<div class="sub warn">⏰ ' + esc(o.key) + '</div></div>';
    });
    h += '<h2 class="sec">为什么这样排</h2>';
    h += '<div class="card"><div class="row"><b>延长一天后，三个景点全保住了。</b>原方案（10/5离开）只有2个整天，我曾建议舍弃都江堰——它全户外怕雨、又卡在返程日。现在多一天，取舍不成立了。</div>'
      + '<div class="row"><b>10/3 三星堆 + 10/4 熊猫基地 + 10/5 都江堰</b>的排序逻辑：三星堆是室内馆，放在雨概率最高的10/3；熊猫必须赶7:30开园（10点后就躲进室内），10/4 是周日且在国庆假期内，6号别墅正常开放；都江堰全户外最怕雨，而目前预报10/5是这几天里相对最好的一天（阴而非雨）。</div>'
      + '<div class="row"><b>这次对调（10/3⇄10/4）让节奏更顺</b>：10/2 深夜吃完蹄花，10/3 只需7:00起床；而唯一需要6:20猛早起的熊猫基地，被放到已经休整过一天之后。蹄花挪到落地当晚也正好——它20:00才开门。</div>'
      + '<div class="row"><b>10/5 下午建议直接回成都</b>，不赶青城山、不留夜堰——守住「美食优先」，也为次日12:15上车的硬底线留出体力。</div></div>';
    return h;
  }

  /* SECTION: render-tabs */
  TABS.forEach(function(t){
    var b = document.createElement("button");
    b.type = "button"; b.className = "tab"; b.id = "tab-" + t.id;
    b.setAttribute("role","tab"); b.setAttribute("aria-selected","false");
    b.setAttribute("data-tab", t.id);
    b.innerHTML = esc(t.label) + '<span>' + esc(t.sub) + '</span>';
    tabsEl.appendChild(b);
  });

  /* SECTION: render-panels */
  document.getElementById("alerts").innerHTML = alertStack();
  var html = "";
  TABS.forEach(function(t){
    var inner = "";
    var day = null;
    D.days.forEach(function(d){ if(d.id === t.id) day = d; });
    if(day) inner = dayPanel(day);
    else if(t.id === "p-ticket") inner = ticketPanel();
    else if(t.id === "p-food")   inner = foodPanel();
    else if(t.id === "p-info")   inner = infoPanel();
    else if(t.id === "p-over")   inner = overPanel();
    html += '<section class="panel" id="panel-' + t.id + '" role="tabpanel" aria-labelledby="tab-' + t.id + '">' + inner + '</section>';
  });
  mainEl.innerHTML = html;

  footEl.innerHTML = esc(D.meta.hotel) + '<br>' + esc(D.meta.updatedNote);

  /* SECTION: switch-tab */
  var current = null;
  function selectTab(id, scroll){
    current = id;
    TABS.forEach(function(t){
      var btn = document.getElementById("tab-" + t.id);
      var pan = document.getElementById("panel-" + t.id);
      var on = (t.id === id);
      btn.setAttribute("aria-selected", on ? "true" : "false");
      pan.classList.toggle("on", on);
      if(on){
        var r = btn.getBoundingClientRect();
        if(r.left < 4 || r.right > window.innerWidth - 4){
          btn.scrollIntoView({ inline:"center", block:"nearest", behavior:"smooth" });
        }
      }
    });
    if(scroll !== false) window.scrollTo({ top:0, behavior:"auto" });
    updateFab();
  }

  tabsEl.addEventListener("click", function(e){
    var b = e.target.closest("[data-tab]");
    if(b) selectTab(b.getAttribute("data-tab"));
  });

  /* SECTION: alert-collapse */
  (function(){
    var collapsed = false;
    try{ collapsed = localStorage.getItem(LS_ALERT) === "1"; }catch(e){}
    function apply(){
      var body = document.getElementById("alertBody");
      var chev = document.getElementById("alertChev");
      var btn  = document.getElementById("alertToggle");
      if(!body) return;
      body.style.display = collapsed ? "none" : "block";
      if(chev) chev.textContent = collapsed ? "▸" : "▾";
      if(btn) btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
    }
    apply();
    var t = document.getElementById("alertToggle");
    if(t) t.addEventListener("click", function(){
      collapsed = !collapsed;
      try{ localStorage.setItem(LS_ALERT, collapsed ? "1" : "0"); }catch(e){}
      apply();
    });
  })();

  /* SECTION: todo-toggle — REQ-003 */
  mainEl.addEventListener("click", function(e){
    var row = e.target.closest("[data-todo]");
    if(!row) return;
    toggleTodo(row);
  });
  mainEl.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " ") return;
    var row = e.target.closest("[data-todo]");
    if(!row) return;
    e.preventDefault(); toggleTodo(row);
  });
  function toggleTodo(row){
    var id = row.getAttribute("data-todo");
    var on = !doneMap[id];
    if(on) doneMap[id] = true; else delete doneMap[id];
    saveState(doneMap);
    row.classList.toggle("done", on);
    row.setAttribute("aria-checked", on ? "true" : "false");
    var cb = row.querySelector(".cbx");
    if(cb) cb.textContent = on ? "✓" : "";
    var done = D.todos.filter(function(t){ return doneMap[t.id]; }).length;
    var hl = document.querySelector("#panel-p-ticket .hl");
    if(hl) hl.textContent = "已完成 " + done + " / " + D.todos.length + " 项 · 勾选状态保存在本机浏览器，下次打开仍在";
    row.animate([{transform:"scale(1)"},{transform:"scale(.985)"},{transform:"scale(1)"}], {duration:160});
  }

  /* SECTION: fab — REQ-001/002 定位到当天重点 */
  function isDay(id){ for(var i=0;i<D.days.length;i++){ if(D.days[i].id===id) return true; } return false; }
  function todayTab(){
    var now = new Date();
    var map = { "2026-10-2":"d1002","2026-10-3":"d1003","2026-10-4":"d1004","2026-10-5":"d1005","2026-10-6":"d1006" };
    return map[now.getFullYear() + "-" + (now.getMonth()+1) + "-" + now.getDate()] || "d1003";
  }
  function updateFab(){
    fabEl.textContent = isDay(current) ? "▲ 跳到今日重点" : "▲ 回到当天行程";
  }
  fabEl.addEventListener("click", function(){
    var target = isDay(current) ? current : todayTab();
    if(target !== current){ selectTab(target, false); }
    var pan = document.getElementById("panel-" + target);
    var key = pan ? pan.querySelector(".ev.key") : null;
    if(key){
      var y = key.getBoundingClientRect().top + window.pageYOffset - 150;
      window.scrollTo({ top:y, behavior:"smooth" });
      key.querySelector(".body").animate([{boxShadow:"0 0 0 0 rgba(179,52,31,.5)"},{boxShadow:"0 0 0 12px rgba(179,52,31,0)"}], {duration:900});
    } else {
      window.scrollTo({ top:0, behavior:"smooth" });
    }
  });

  /* SECTION: init */
  selectTab(defaultTab(), false);
})();
</script>
</body>
</html>
